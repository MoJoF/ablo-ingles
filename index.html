<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/vars.css">
    <link rel="stylesheet" href="/css/texts.css">
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <header>
        <a href="/" class="site-title">ablo-ingles</a>
        <nav>
            <a href="/about" class="nav-link">О нас</a>
            <a href="/ad" class="nav-link">Реклама</a>
            <a href="/contacts" class="nav-link">Контакты</a>
        </nav>
    </header>

    <main>
        <!-- Меню. Если пользователь не авторизован, удалить -->
        <div class="menu">
            <a class="menu-item" href="/quiz">
                <img src="/icons/quiz.svg" alt="Пройти тест" class="menu-icon">
                <span class="button-text">Пройти тест</span>
            </a>
            <a class="menu-item" href="/dictionary">
                <img src="/icons/dictionary.svg" alt="Словарь" class="menu-icon">
                <span class="button-text">Словарь</span>
            </a>
        </div>

        <div id="posts-cont"></div>
    </main>

    <footer>
        <p class="footer-text">Сайт разработан в 2025 году</p>
        <p class="footer-dev-text">© flybuk</p>
    </footer>

    <script src="/js/checkAuth.js"></script>

    <script>
        function renderPosts(data) {
            const cont = document.querySelector('#posts-cont')
            const frag = new DocumentFragment()

            const isAuth = sessionStorage.getItem('isAuth')

            if (!isAuth) {
                data.forEach(post => {
                    const postCont = document.createElement('div')
                    postCont.className = "post-cont"

                    const postPreview = document.createElement('span')
                    postPreview.className = "post-preview"
                    postPreview.textContent = post.post_text.split(" ").filter((w, i) => i < 10).join(" ")

                    postCont.appendChild(postPreview)

                    frag.appendChild(postCont)
                })

                cont.appendChild(frag)
            } else {
                data.forEach(post => {
                    
                })
            }

        }

        document.addEventListener('DOMContentLoaded', function() {
            fetch('https://ablo-ingles.omyraucy.workers.dev/posts', {
                method: "GET",
                headers: { "Content-Type": 'application/json' }
            })
                .then(resp => resp.json())
                .then(data => renderPosts(data.posts))
        })
    </script>
</body>

</html>
